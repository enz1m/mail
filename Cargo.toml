[package]
name = "mail-app"
repository = "https://github.com/enz1m/mail"
version = "0.1.0"
authors = ["enzUI contributors"]
edition = "2024"
publish = false
license = "MIT"
description = "Read and organize IMAP mail"
rust-version = "1.95"

[workspace]
resolver = "3"

[features]
x11 = ["iced/x11", "enzui-iced-widgets/x11"]
center = ["dep:enzui-iced-agent", "dep:enzui-iced-agent-app", "dep:serde"]

[dependencies]
tempfile = "3"
enzui-parent-lease = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-wayland = { git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
iced = { default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "canvas", "svg", "a11y", "tokio"], git = "https://github.com/enz1m/enzim-iced.git", rev = "e36b07b591661fdb666088fc943cc0b927a2367b" }
iced_renderer = { default-features = false, git = "https://github.com/enz1m/enzim-iced.git", rev = "e36b07b591661fdb666088fc943cc0b927a2367b" }
enzui-iced-core = { package = "enzui-core", features = ["accesskit", "application-dbus", "activation-native-iced", "notification-freedesktop"], git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-services = { features = ["secret-service", "oauth", "mail-transport"], git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
curl = { version = "=0.4.50", default-features = false, features = ["ssl"] }
futures-channel = "=0.3.33"
imap-proto = "0.17"
tokio = { version = "1.54.1", features = ["time"] }
enzui-iced-theme = { package = "enzui-theme", git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-iced-resources = { package = "enzui-resources", git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-iced-widgets = { package = "enzui-widgets", features = ["portal-dbus", "application-dbus"], git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-iced-agent = { package = "enzui-agent", features = ["iced-consumer"], optional = true, git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
enzui-iced-agent-app = { package = "enzui-agent-app", optional = true, git = "https://github.com/enz1m/enzui.git", rev = "f48e48082ce968d57734fd9ef090c9131572e179" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"

enzui-webkit = { git = "https://github.com/enz1m/enzim-webkit-rs.git", rev = "1541ed072d75825088e0d15e818f8f118d770ae7", default-features = false }
enzui-iced-webview = { package = "enzui-webview", git = "https://github.com/enz1m/enzim-webkit-rs.git", rev = "1541ed072d75825088e0d15e818f8f118d770ae7", default-features = false }
ammonia = "4"
blitz-html = "=0.3.0-beta.4"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["system-fonts", "accessibility", "floats"] }
blitz-traits = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = { version = "=0.18.0", default-features = false }
keyboard-types = "0.8"
cursor-icon = "1"
csscolorparser = "0.8"
html5ever = "=0.40.1"
cssparser = "=0.38.0"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
iced_test = { git = "https://github.com/enz1m/enzim-iced.git", rev = "e36b07b591661fdb666088fc943cc0b927a2367b" }

[patch.crates-io]
accesskit = { git = "https://github.com/enz1m/enzim-accesskit.git", rev = "7da7ac7b800fabf0bd2ba62eef23fa9117a684f4" }
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "e182645b56d15e637bb6c8144f99ebfa7f900716" }
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "40eeb41f8637ef1620afa377ba006874224b6d65" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[lints]
workspace = true

[[test]]
name = "html-renderer"
path = "tests/html_renderer.rs"
harness = false

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
